<button type="button"
        class="day clickable"
        [id]="'day-' + day.number + '-' + day.date.getMonth() + '-' + day.date.getFullYear()"
        [attr.data-date]="day.iso"
        [class.today]="day.isToday"
        [class.past]="day.isPast"
        [class.weekend]="day.weekDay >= 5"
        [class.adding]="isAddingEvent"
        [class.empty]="!events.length"
        [style.--hover-c]="events.length ? events[0].colour : null"
        [attr.aria-label]="day.label + (events.length ? ', ' + events.length + ' events' : '')"
        (mouseenter)="events.length && hoverChange.emit($any($event.currentTarget))"
        (mouseleave)="events.length && hoverChange.emit(null)"
        (click)="dayClick.emit({ day, mouseEvent: $event })">
  <span class="num">
    {{ day.number }}
    @if (icon) {
      <span class="icon"
            aria-hidden="true">{{ icon }}</span>
    }
    @if (hasHiddenEvents) {
      <span class="more"
            aria-hidden="true"></span>
    }
  </span>
  <span class="lanes"
        aria-hidden="true">
    @for (event of visibleEvents; track event.id) {
      <span class="line"
            [attr.data-event]="event.id"
            [class.start]="event.isFirstDay"
            [class.end]="event.isLastDay"
            [style.--c]="event.colour"
            [style.--lane]="event.lane"></span>
    }
  </span>
</button>
