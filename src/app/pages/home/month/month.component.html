<section class="month"
         [class.current]="month.isCurrent"
         [attr.aria-label]="month.name">
  <h2>{{ month.name }}</h2>
  <div class="grid">
    @for (weekDay of weekDays; track $index) {
      <span class="weekday"
            aria-hidden="true">{{ weekDay }}</span>
    }
    @for (day of month.days; track day.key) {
      <app-day [day]="day"
               [events]="eventsByDay.get(day.key) ?? noEvents"
               [isAddingEvent]="isAddingEvent"
               [style.grid-column-start]="$first ? day.weekDay + 1 : null"
               (dayClick)="onDayClick($event)"
               (hoverChange)="dayHover.emit($event ? { day, events: eventsByDay.get(day.key) ?? noEvents, element: $event } : null)" />
    }
  </div>
</section>
