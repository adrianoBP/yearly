<main class="page">
  <header class="page-header">
    <a class="icon-btn"
       routerLink="/home"
       aria-label="Back to calendar"
       title="Back to calendar">
      <fa-icon [icon]="backIcon" />
    </a>
    <div>
      <h1>Settings</h1>
      <p class="muted">{{ userService.emailAddress }}</p>
    </div>
  </header>

  <section class="card">
    <div class="card-header">
      <h2>Calendars</h2>
      <div class="legend muted">
        <span><fa-icon [icon]="declineEventIcon"
                   size="sm" /> Declined</span>
        <span><fa-icon [icon]="infinityIcon"
                   size="sm" /> Recurring</span>
        <span><fa-icon [icon]="cakeIcon"
                   size="sm" /> Birthdays</span>
      </div>
    </div>

    <ul class="calendars">
      @for (calendar of calendars; track calendar.id) {
        @let calendarSettings = getCalendarSettings(calendar.id);
        <li>
          <input type="checkbox"
                 class="switch"
                 [id]="'calendar-' + calendar.id"
                 [checked]="calendarSettings?.allowed"
                 (change)="toggleSetting(calendar.id, 'allowed')">
          <span class="dot"
                [style.background-color]="calendar.backgroundColor"></span>
          <label class="name"
                 [for]="'calendar-' + calendar.id">{{ calendarService.getCalendarName(calendar) }}</label>

          <div class="chips">
            <label class="chip"
                   title="Show declined events">
              <input type="checkbox"
                     class="visually-hidden"
                     aria-label="Show declined events"
                     [checked]="calendarSettings?.showDeclinedEvents"
                     [disabled]="!calendarSettings?.allowed"
                     (change)="toggleSetting(calendar.id, 'declined-events')">
              <fa-icon [icon]="declineEventIcon"
                       size="sm" />
            </label>
            <label class="chip"
                   title="Show recurring events">
              <input type="checkbox"
                     class="visually-hidden"
                     aria-label="Show recurring events"
                     [checked]="calendarSettings?.allowRecurring"
                     [disabled]="!calendarSettings?.allowed"
                     (change)="toggleSetting(calendar.id, 'recurring')">
              <fa-icon [icon]="infinityIcon"
                       size="sm" />
            </label>
            <label class="chip"
                   title="Show birthdays">
              <input type="checkbox"
                     class="visually-hidden"
                     aria-label="Show birthdays"
                     [checked]="calendarSettings?.allowBirthdays"
                     [disabled]="!calendarSettings?.allowed || !calendarSettings?.allowRecurring"
                     (change)="toggleSetting(calendar.id, 'birthdays')">
              <fa-icon [icon]="cakeIcon"
                       size="sm" />
            </label>
          </div>
        </li>
      } @empty {
        <li class="muted">Loading calendars…</li>
      }
    </ul>
  </section>

  <section class="card">
    <div class="card-header">
      <h2>Preferences</h2>
    </div>
    <ul class="preferences">
      <li>
        <label for="show-disabled-calendars">Show disabled calendars when editing events</label>
        <input id="show-disabled-calendars"
               type="checkbox"
               class="switch"
               [checked]="settings.showDisabledCalendars"
               (change)="settings.showDisabledCalendars = !settings.showDisabledCalendars; settingsService.setSettings(settings)">
      </li>
      <li>
        <label for="close-all-windows">Close all panels when clicking outside</label>
        <input id="close-all-windows"
               type="checkbox"
               class="switch"
               [checked]="settings.closeAllWindows"
               (change)="settings.closeAllWindows = !settings.closeAllWindows; settingsService.setSettings(settings)">
      </li>
    </ul>
  </section>

  <footer class="muted version">
    <a routerLink="/privacy-policy">Privacy policy</a>
    <span>v{{ utilService.version }}</span>
  </footer>
</main>
