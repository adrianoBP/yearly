<div class="backdrop"
     [class.from-left]="side === 'left'"
     [class.from-right]="side === 'right'"
     (click)="onBackdropClick()">
  @for (window of windowsService.windowQueue; track window) {
    <div class="window"
         role="dialog"
         aria-modal="true"
         [class.wide]="window.type === 'year-review'"
         [style.view-transition-name]="$last ? 'panel' : null"
         (click)="$event.stopPropagation()">
      @if (window.type === 'list-events') {
        <app-events-list />
      }
      @if (window.type === 'edit-event') {
        <app-event-edit />
      }
      @if (window.type === 'leave-planner') {
        <app-leave-planner />
      }
      @if (window.type === 'year-review') {
        <app-year-review />
      }
      @if (window.type === 'ask-calendar') {
        <app-ask-calendar />
      }
    </div>
  }
</div>
