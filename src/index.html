<!doctype html>
<html lang="en">

<head>
      <meta charset="utf-8">
      <title>Yearly</title>
      <base href="/">
      <meta name="viewport"
            content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
      <link rel="icon"
            type="image/svg+xml"
            href="yearly-icon.svg">
      <link rel="manifest"
            href="manifest.webmanifest">
      <meta name="description"
            content="See your whole Google Calendar year at a glance.">
      <link rel="preconnect"
            href="https://accounts.google.com">
      <link rel="preconnect"
            href="https://www.googleapis.com">
      <meta name="theme-color"
            content="#f6f7f9">
</head>

<body>
      <app-root></app-root>
      <!-- What crawlers without JavaScript (e.g. Google's OAuth verification) see as the homepage -->
      <noscript>
            <main style="max-width: 40rem; margin: 0 auto; padding: 3rem 1.25rem; line-height: 1.6;">
                  <h1>Yearly</h1>
                  <p><strong>Yearly shows your whole Google Calendar year on one page.</strong> All twelve months sit side
                        by side, so you can plan holidays, spot busy stretches and keep long-term goals in sight.</p>
                  <ul>
                        <li>See every event of the year at a glance, in the colours of its calendar.</li>
                        <li>Create, edit and delete events, saved straight to your Google Calendar.</li>
                        <li>Plan leave, search events and review your year.</li>
                  </ul>
                  <p>You sign in with your Google account. Yearly asks for access to your Google Calendar to show and edit
                        your events, and to a hidden app folder in your Google Drive to sync your Yearly settings between
                        devices. It cannot see your other Drive files. Read how your data is handled in the
                        <a href="/privacy-policy">privacy policy</a>.</p>
                  <p>Yearly needs JavaScript. Please enable it to use the app.</p>
            </main>
      </noscript>
</body>

</html>
